<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e096"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8c6a21"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2532"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#c9a84c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded Box Background -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Scissors Icon with Golden Glow -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)">
    <!-- Blade 1 -->
    <path d="M21 21 L43 43"/>
    <!-- Blade 2 -->
    <path d="M43 21 L21 43"/>
    <!-- Handle Loop 1 -->
    <circle cx="17" cy="17" r="6.5"/>
    <!-- Handle Loop 2 -->
    <circle cx="17" cy="47" r="6.5"/>
    <!-- Center Pivot Dot -->
    <circle cx="32" cy="32" r="2" fill="url(#goldGrad)" stroke="none"/>
  </g>
</svg>